name: TLDR
options:
  bundleIdPrefix: io.github.tlajer
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 63E525EQ35
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
packages:
  MarkdownRenderer:
    path: Packages/MarkdownRenderer
targets:
  TLDR:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_NAME: TLDR
        PRODUCT_MODULE_NAME: TLDR
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tlajer.tldr
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MarkdownRenderer
      - target: TLDRQuickLook
        embed: true
        codeSign: true
  TLDRQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tlajer.tldr.QuickLook
        CODE_SIGN_ENTITLEMENTS: QuickLook/QuickLook.entitlements
        INFOPLIST_FILE: QuickLook/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: MarkdownRenderer
      - sdk: Quartz.framework
